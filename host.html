<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quiz-Moderation · Immobilienstammtisch Hagen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  body.stage { background: var(--navy); color: #f2f0eb; }
  .stage .brand b { color: #f2f0eb; }
  .stage .brand span { color: var(--teal-light); }
  .stagewrap { max-width: 1400px; margin: 0 auto; padding: 28px 40px; min-height: 100vh; display: flex; flex-direction: column; }
  .grid { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 48px; align-items: center; flex: 1; }
  .qrbox { background: #fff; border-radius: 20px; padding: 22px; text-align: center; color: var(--navy); }
  .qrbox #qr { display: flex; justify-content: center; }
  .qrbox #qr img, .qrbox #qr canvas { width: 100% !important; height: auto !important; max-width: 360px; }
  .qrbox .url { font-weight: 800; font-size: 22px; margin-top: 14px; word-break: break-all; }
  .stage h1 { font-size: 64px; letter-spacing: -1.5px; margin-bottom: 18px; }
  .stage .eyebrow { color: var(--teal-light); font-size: 16px; }
  .stats { display: flex; gap: 40px; margin: 24px 0 32px; }
  .stat .num { font-size: 88px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .lbl { color: #b9c3d3; font-weight: 600; margin-top: 6px; }
  .clock { font-size: 120px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .controls { display: flex; gap: 14px; flex-wrap: wrap; }
  .controls .btn { width: auto; padding: 18px 34px; font-size: 20px; margin: 0; }
  .btn.light { background: #f2f0eb; color: var(--navy); }
  .footer { display: flex; gap: 18px; justify-content: flex-end; margin-top: 24px; }
  .footer button { background: none; border: 0; color: #7d8aa3; cursor: pointer; font-size: 13px; text-decoration: underline; }
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 24px; align-items: end; margin: 30px 0; }
  .place { background: var(--navy-2); border-radius: 20px; padding: 28px 22px; text-align: center; min-height: 220px;
           display: flex; flex-direction: column; justify-content: center; transition: transform .4s, opacity .4s; }
  .place.p1 { background: var(--teal); min-height: 290px; }
  .place.hidden { opacity: .25; }
  .place .rank { font-size: 22px; font-weight: 700; color: var(--teal-light); }
  .place.p1 .rank { color: #f2f0eb; }
  .place .who { font-size: 38px; font-weight: 800; margin: 10px 0; line-height: 1.1; }
  .place .meta { font-size: 20px; color: #dfe5ee; font-variant-numeric: tabular-nums; }
  table.board { width: 100%; border-collapse: collapse; font-size: 18px; }
  table.board td { padding: 8px 10px; border-bottom: 1px solid #34466a; font-variant-numeric: tabular-nums; }
  .note { color: #b9c3d3; }
  .gate { max-width: 420px; margin: 18vh auto 0; }
  @media (max-width: 900px) {
    .stagewrap { padding: 20px 16px; }
    .grid { grid-template-columns: 1fr; gap: 24px; }
    .stage h1 { font-size: 40px; }
    .stat .num { font-size: 56px; }
    .clock { font-size: 72px; }
    .podium { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="stage">
<div class="stagewrap">
  <div class="brand"><b>R&amp;G</b><span>Zeit für Neues.</span></div>
  <div id="app"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
<script>
const app = document.getElementById('app');
const PLAYER_URL = new URL('./', location.href).href;
let pin = null;
try { pin = sessionStorage.getItem('quiz.pin'); } catch (e) { /* privat */ }
let state = null;
let offset = 0;
let board = null;
let revealed = 0;          // 0 = nichts, 1 = Platz 3, 2 = Platz 2, 3 = Platz 1, 4 = Tabelle
let view = '';
let clockHandle = null;

function savePin(p) { pin = p; try { sessionStorage.setItem('quiz.pin', p); } catch (e) { /* privat */ } }

function renderGate(msg) {
  view = 'gate';
  app.innerHTML = `
    <div class="gate card" style="color:var(--navy)">
      <h2>Moderation</h2>
      <form id="g">
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off">
        ${msg ? `<div class="error">${esc(msg)}</div>` : ''}
        <button class="btn" style="margin-top:14px">Weiter</button>
      </form>
    </div>`;
  document.getElementById('g').onsubmit = async ev => {
    ev.preventDefault();
    const p = document.getElementById('pin').value.trim();
    try { await rpc('quiz_host', { p_pin: p, p_action: 'check' }); savePin(p); poll(); }
    catch (e) { renderGate(e.message); }
  };
}

async function act(action) {
  try {
    state = await rpc('quiz_host', { p_pin: pin, p_action: action });
    if (action === 'reset') { board = null; revealed = 0; }
    render(true);
  } catch (e) { alert(e.message); }
}

let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  const loop = async () => {
    try {
      const s = await rpc('quiz_get_state');
      offset = new Date(s.server_now).getTime() - Date.now();
      const changed = !state || s.status !== state.status || s.round !== state.round;
      state = s;
      if (changed) render(true); else updateLive();
    } catch (e) { /* nächster Versuch */ }
    setTimeout(loop, 1500);
  };
  loop();
}

function updateLive() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('players', state.players);
  set('submitted', state.submitted);
}

function stopClock() { if (clockHandle) { clearInterval(clockHandle); clockHandle = null; } }

function render(force) {
  stopClock();
  if (!state) { app.innerHTML = '<p class="pulse">Verbinde …</p>'; return; }
  if (state.status === 'lobby') renderLobby();
  else if (state.status === 'running') renderRunning();
  else renderClosed();
}

function qrHtml() {
  return `<div class="qrbox"><div id="qr"></div><div class="url">${esc(PLAYER_URL.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</div></div>`;
}
function drawQr() {
  const el = document.getElementById('qr');
  if (!el || !window.QRCode) return;
  el.innerHTML = '';
  new QRCode(el, { text: PLAYER_URL, width: 512, height: 512, colorDark: '#1f2e4a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}

function footer() {
  return `<div class="footer">
    <button id="contact">Kontakt Gewinner</button>
    <button id="reset">Testlauf zurücksetzen</button>
    <button id="logout">PIN abmelden</button>
  </div>`;
}
function bindFooter() {
  document.getElementById('reset').onclick = () => {
    const t = prompt('Alle Anmeldungen und Ergebnisse löschen und von vorn beginnen? Zum Bestätigen RESET eintippen.');
    if (t === 'RESET') act('reset');
  };
  document.getElementById('logout').onclick = () => { try { sessionStorage.removeItem('quiz.pin'); } catch (e) {} location.reload(); };
  document.getElementById('contact').onclick = async () => {
    if (!confirm('Handynummern der Bestplatzierten anzeigen? (Nicht auf dem Beamer zeigen.)')) return;
    try {
      const rows = await rpc('quiz_leaderboard', { p_pin: pin, p_with_phone: true });
      alert(rows.slice(0, 5).map(r => `${r.rang}. ${r.name} · ${r.phone} · ${r.score}/${state.total} · ${fmtTime(r.duration_ms)}`).join('\n') || 'Noch keine Abgaben.');
    } catch (e) { alert(e.message); }
  };
}

function renderLobby() {
  app.innerHTML = `
    <div class="grid">
      ${qrHtml()}
      <div>
        <p class="eyebrow">Immobilienstammtisch Hagen · Porsche Zentrum</p>
        <h1>Das Porsche-Quiz</h1>
        <p style="font-size:24px;line-height:1.4">${state.total} Fragen zu den drei Vorträgen. Wer die meisten richtig hat und am schnellsten ist, gewinnt eine <b>Probefahrt im Porsche</b>.</p>
        <p style="font-size:20px" class="note">QR-Code scannen, Namen und Handynummer eingeben, auf den Start warten.</p>
        <div class="stats">
          <div class="stat"><div class="num" id="players">${state.players}</div><div class="lbl">angemeldet</div></div>
        </div>
        <div class="controls"><button class="btn teal" id="start">Quiz starten</button></div>
      </div>
    </div>
    ${footer()}`;
  drawQr();
  bindFooter();
  document.getElementById('start').onclick = () => {
    if (confirm(`Quiz jetzt für alle ${state.players} Angemeldeten starten?`)) act('start');
  };
}

function renderRunning() {
  app.innerHTML = `
    <div class="grid">
      ${qrHtml()}
      <div>
        <p class="eyebrow">Das Quiz läuft</p>
        <div class="clock" id="clock">0:00</div>
        <div class="stats">
          <div class="stat"><div class="num" id="submitted">${state.submitted}</div><div class="lbl">abgegeben</div></div>
          <div class="stat"><div class="num" id="players">${state.players}</div><div class="lbl">angemeldet</div></div>
        </div>
        <div class="controls"><button class="btn light" id="close">Quiz beenden</button></div>
      </div>
    </div>
    ${footer()}`;
  drawQr();
  bindFooter();
  const tick = () => {
    const el = document.getElementById('clock');
    if (!el) return;
    const ms = Math.max(0, Date.now() + offset - Date.parse(state.started_at));
    const s = Math.floor(ms / 1000);
    el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  tick();
  clockHandle = setInterval(tick, 250);
  document.getElementById('close').onclick = () => {
    const open = state.players - state.submitted;
    if (confirm(open > 0 ? `${open} haben noch nicht abgegeben. Trotzdem beenden?` : 'Quiz beenden?')) act('close');
  };
}

async function renderClosed() {
  if (!board) {
    app.innerHTML = '<p class="pulse">Ergebnisse werden geladen …</p>';
    try { board = await rpc('quiz_leaderboard', { p_pin: pin, p_with_phone: false }); }
    catch (e) { app.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
  }
  const total = state.total;
  const p = i => board[i];
  const place = (i, cls, visible) => {
    const r = p(i);
    if (!r) return `<div class="place ${cls} hidden"><div class="rank">Platz ${i + 1}</div><div class="who">–</div></div>`;
    return `<div class="place ${cls}${visible ? '' : ' hidden'}">
      <div class="rank">Platz ${i + 1}</div>
      <div class="who">${visible ? esc(r.name) : '?'}</div>
      <div class="meta">${visible ? `${r.score} / ${total} richtig · ${fmtTime(r.duration_ms)}` : '&nbsp;'}</div>
    </div>`;
  };
  const steps = ['Platz 3 zeigen', 'Platz 2 zeigen', 'Sieger zeigen', 'Ganze Rangliste'];
  let html = `
    <p class="eyebrow">Siegerehrung</p>
    <h1>${revealed >= 3 && p(0) ? 'Glückwunsch, ' + esc(p(0).name) + '!' : 'Und die Probefahrt geht an …'}</h1>
    <div class="podium">
      ${place(1, 'p2', revealed >= 2)}
      ${place(0, 'p1', revealed >= 3)}
      ${place(2, 'p3', revealed >= 1)}
    </div>`;
  if (revealed >= 4) {
    html += `<table class="board">${board.slice(0, 10).map(r => `<tr><td>${r.rang}.</td><td>${esc(r.name)}</td><td>${r.score} / ${total}</td><td>${fmtTime(r.duration_ms)}</td></tr>`).join('')}</table>`;
  }
  html += `<div class="controls" style="margin-top:20px">
      ${revealed < 4 ? `<button class="btn teal" id="next">${steps[revealed]}</button>` : ''}
      <button class="btn light" id="reload">Neu laden</button>
    </div>
    <p class="note" style="margin-top:14px">${board.length} Abgaben · Wertung: erst richtige Antworten, dann Zeit</p>
    ${footer()}`;
  app.innerHTML = html;
  bindFooter();
  const n = document.getElementById('next');
  if (n) n.onclick = () => { revealed++; renderClosed(); };
  document.getElementById('reload').onclick = () => { board = null; renderClosed(); };
}

if (pin) poll(); else renderGate();
</script>
</body>
</html>
